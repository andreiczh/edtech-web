<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Копилот — спайк голосовой петли</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
           max-width: 640px; margin: 40px auto; padding: 0 20px; color: #23232e; }
    h1 { font-size: 22px; }
    p  { color: #555; line-height: 1.5; }
    code { background: #eee; padding: 1px 6px; border-radius: 6px; }
    button { font-size: 18px; padding: 14px 26px; border: none; border-radius: 999px;
             background: #534e89; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin: 16px 0; color: #666; }
    .row { margin: 12px 0; padding: 12px 14px; border-radius: 10px; background: #f4f3f8; }
    .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    audio { width: 100%; margin: 12px 0; }
    pre { background: #f0eef6; padding: 12px; border-radius: 8px; font-size: 13px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Спайк голосовой петли</h1>
  <p>Нажми «Говорить», скажи фразу <b>по-английски</b>, нажми ещё раз. Бэкенд:
     <code>/talk</code>. Разреши доступ к микрофону.</p>

  <button id="btn">🎤 Говорить</button>
  <div id="status">Готов.</div>

  <div class="row"><div class="label">Ты сказал</div><div id="user">—</div></div>
  <div class="row"><div class="label">Ответ ИИ</div><div id="ai">—</div></div>
  <audio id="player" controls></audio>
  <pre id="latency"></pre>

  <script>
    // Если открыть файл напрямую (file://) — бьёмся в localhost:8000; если бэкенд отдаёт
    // страницу сам (http://localhost:8000/) — относительный путь.
    const BACKEND = location.protocol === 'file:' ? 'http://localhost:8000/talk' : '/talk';

    const btn = document.getElementById('btn');
    const statusEl = document.getElementById('status');
    let mediaRecorder, chunks = [], recording = false;

    const MIC_HELP =
      'Микрофон недоступен в этом контексте. Открой страницу по адресу ' +
      'http://localhost:8000/ (а не двойным кликом по файлу и не по IP). ' +
      'Браузер даёт доступ к микрофону только на localhost или https.';

    // Проверка при загрузке: если нет mediaDevices — значит контекст небезопасный
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      statusEl.textContent = MIC_HELP;
      btn.disabled = true;
    }

    btn.onclick = async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent = MIC_HELP;
        return;
      }
      if (!recording) {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          statusEl.textContent = 'Нет доступа к микрофону: ' + e.message;
          return;
        }
        mediaRecorder = new MediaRecorder(stream);
        chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = send;
        mediaRecorder.start();
        recording = true;
        btn.textContent = '⏹ Стоп';
        statusEl.textContent = 'Запись… говори.';
      } else {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
        recording = false;
        btn.textContent = '🎤 Говорить';
        statusEl.textContent = 'Отправляю на бэкенд…';
      }
    };

    async function send() {
      const blob = new Blob(chunks, { type: 'audio/webm' });
      const fd = new FormData();
      fd.append('audio', blob, 'speech.webm');
      btn.disabled = true;
      try {
        const t0 = performance.now();
        const res = await fetch(BACKEND, { method: 'POST', body: fd });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        document.getElementById('user').textContent = data.user || '—';
        document.getElementById('ai').textContent = data.ai || '—';
        document.getElementById('player').src = 'data:audio/wav;base64,' + data.audio_b64;
        document.getElementById('player').play().catch(() => {});
        const roundtrip = ((performance.now() - t0) / 1000).toFixed(2);
        document.getElementById('latency').textContent =
          JSON.stringify({ ...data.latency, roundtrip_с_сетью: roundtrip }, null, 2);
        statusEl.textContent = 'Готово.';
      } catch (e) {
        statusEl.textContent = 'Ошибка: ' + e.message + ' — бэкенд запущен на :8000?';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
