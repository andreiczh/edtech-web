# Render Blueprint. С этим файлом деплой — это «подключить репозиторий», а не
# сборка образа руками: Render сам склонирует GitHub, соберёт Dockerfile и выдаст
# постоянный HTTPS-адрес вида https://pingo-ai.onrender.com
#
# Почему Render, а не Hugging Face и не Cloud.ru (проверено 22.07.2026):
#   - HF около 8 июля 2026 закрыл бесплатные Docker-Spaces (теперь PRO $9/мес,
#     оплата Stripe — российская карта не пройдёт);
#   - Cloud.ru требует собрать и запушить образ самому, то есть Docker на машине,
#     плюс 100 ₽ на счету, плюс акция кончается 31.12.2026;
#   - Render: карта не нужна, России нет в списке запрещённых регионов, а адрес
#     *.onrender.com проверен из РФ зондами пяти провайдеров (Ростелеком, МТС,
#     МегаФон, Билайн, ЭР-Телеком).
#
# ⚠️ Ограничения бесплатного тарифа, которые надо знать заранее:
#   - 512 МБ памяти и 0.1 CPU. Мы влезаем ТОЛЬКО потому, что распознавание ушло
#     в Mistral: процесс 99 МБ вместо 332 МБ и почти не считает. Локальный whisper
#     на 0.1 ядра не поедет — не ставь здесь STT_PROVIDER=local.
#   - Сервис засыпает после 15 минут простоя и просыпается ~минуту, показывая
#     страницу-заглушку. 750 часов в месяц хватает на круглосуточную работу, так
#     что лечится пингом раз в 10 минут (см. docs/DEPLOY-RENDER.md).
services:
  - type: web
    name: pingo-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Единственный секрет. Задаётся в панели Render, в git не попадает.
      - key: LLM_API_KEY
        sync: false
      # Распознавание через Mistral — обязательно на этом тарифе, см. выше.
      - key: STT_PROVIDER
        value: mistral
      # Откат на локальный whisper ЗАПРЕЩЁН здесь, и это не перестраховка.
      # Найдено тестом 22.07.2026: на битом аудио Mistral отказывает, срабатывает
      # откат, и контейнер на 512 МБ пытается поднять модель на 150 МБ. Одна плохая
      # запись одного ученика могла бы уронить сервис по памяти для всех.
      - key: STT_FALLBACK_LOCAL
        value: "0"
      # Самопинг раз в 10 минут, чтобы сервис не засыпал и первый зашедший друг не
      # ждал минуту, глядя на заглушку. Адрес — свой собственный, публичный.
      # Окно 04:00-20:00 UTC = 07:00-23:00 МСК: круглосуточный пинг съел бы все 750
      # часов месячной квоты без запаса, а ночью сервису бодрствовать незачем.
      - key: KEEP_AWAKE_URL
        value: https://pingo-ai-dpd9.onrender.com
      # Месячный бюджет вызовов LLM — САМОограничение, чтобы даже дикий месяц
      # не выжег ключ Mistral. 30000 запросов ≈ 10 учеников по 100 реплик в день.
      # При 80%+ и опережении календаря лимиты мягко ужимаются, полный стоп —
      # только на 100%. Узнаешь реальную квоту в консоли Mistral — поменяй тут.
      - key: MONTHLY_LLM_BUDGET
        value: "30000"
      # Точное распознавание ТОЛЬКО для оцениваемых заданий 39-42: там каждое
      # слово превращается в балл ФИПИ, а лишняя секунда незаметна (ученик уже
      # отговорил минуту). Разговор остаётся на быстрой voxtral-mini. Пусто =
      # везде одна и та же модель. Любой сбой откатывается на обычный путь.
      - key: STT_TASK_MODEL
        value: "voxtral-small-latest"
      # OUTBOUND_LOCAL_IP здесь НЕ задавать: это адрес домашнего Wi-Fi, нужный
      # только чтобы обойти VPN на машине разработки. В облаке VPN нет, а
      # несуществующий адрес уронил бы каждый исходящий запрос на bind.
