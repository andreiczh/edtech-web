name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gospeak_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      P1_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/gospeak_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/test-backend.py
      - run: python -m pip install pip-audit && python -m pip_audit -r backend/requirements.txt
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gospeak-ci .
      - run: docker run -d --name gospeak-ci -e PORT=7860 -e STT_PROVIDER=mistral -e STT_FALLBACK_LOCAL=0 -p 127.0.0.1:7860:7860 gospeak-ci
      - run: python scripts/test-container.py
      - if: always()
        run: docker logs gospeak-ci
